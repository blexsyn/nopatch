# nopatch 模板计划配置
# =====================
# 将此文件重命名为 <your-plan-name>.toml 即可创建计划。
#
# 文件结构：
#   output_base         — 输出基准目录（顶层键，在 [vars] 之前）
#   [vars]              — 模板变量（仅用于 {{varName}} 替换）
#   [[dyna_file_path]]  — 动态路径（顶层数组，在 [vars] 之后）
#
# ⚠️ 注意：output_base 和 [[dyna_file_path]] 是顶层结构配置，不要写在 [vars] 内部。

# 输出基准目录，相对于 package.json（项目根目录）
# 未配置 dyna_file_path 的模板文件默认以相同相对路径输出到此目录
output_base = "."

# ============================================================
# [vars] — 模板变量
# 在此段落中声明的变量可在模板内容和路径字段中使用，格式为 {{varName}}
# ============================================================
[vars]
name = "World"
plan = "example"

# ============================================================
# 动态文件路径配置（顶层数组，不在 [vars] 内）
# 仅需配置需要非默认输出路径的文件
# 以下所有路径均相对于 output_base
# ============================================================
#
# [[dyna_file_path]]
# src      = "path/to/file.mustache"
#            # 相对于 tpl_record/<plan>/
#
# dest     = "subdir/SomeFile.java"
#            # 相对于 output_base
#
# destAbs  = "C:/absolute/path/to/SomeFile.java"
#            # 操作系统根目录的绝对路径
#
# overwrite = true
#            # 默认 true，目标存在时覆盖；false 则跳过
