# nopatch 模板计划配置
# [vars] 中的变量可在模板内容和路径字段中使用，格式为 {{varName}}

[vars]
name = "World"
plan = "example"

# 输出基准目录，相对于 package.json（项目根目录）
# 未配置的模板文件默认以相同相对路径输出到 output_base
output_base = "."

# 动态文件路径配置
# 仅需配置需要非默认输出路径的文件
# 以下所有路径均相对于 output_base
#
# [[dyna_file_path]]
# src      = "path/to/file.mustache"
#            # 相对于 tpl_record/<plan>/
#
# dest     = "subdir/SomeFile.java"
#            # 相对于 output_base
#
# destAbs  = "C:/absolute/path/to/SomeFile.java"
#            # 操作系统根目录的绝对路径
#
# overwrite = true
#            # 默认 true，目标存在时覆盖；false 则跳过
